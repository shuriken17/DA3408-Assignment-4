route:
  group_by: ["alertname"]
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 30s
  receiver: "web.hook"

receivers:
  - name: "web.hook"
    webhook_configs:
      - url: "https://webhook.site/e5956881-a25a-4f37-9583-baf9f41d9052"

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["instance"]
